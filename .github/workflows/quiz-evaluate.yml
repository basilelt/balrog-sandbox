name: PR Balrog — Evaluate Answers

on:
  issue_comment:
    types: [created, edited]

permissions:
  checks: write
  pull-requests: write
  contents: read
  actions: write

jobs:
  evaluate-quiz:
    name: Evaluate Quiz Answers
    runs-on: ubuntu-latest
    if: startsWith(github.event.comment.body, '!balrog') || contains(github.event.comment.body, '<!-- balrog-mode: checkbox -->')

    steps:
      - name: Evaluate answers
        uses: basilelt/pr-balrog/evaluate@feat/checkbox-answer-mode
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: 'auto'
